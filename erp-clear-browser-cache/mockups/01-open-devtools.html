<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1440px;
      height: 900px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: url("../images/01-open-devtools.png") center / cover no-repeat;
      position: relative;
    }
    .menu {
      position: absolute;
      left: 420px;
      top: 280px;
      width: 240px;
      background: #fff;
      border: 1px solid #d4d7dc;
      border-radius: 6px;
      box-shadow: 0 8px 28px rgba(0,0,0,.18);
      padding: 6px 0;
      font-size: 13px;
      color: #1f2937;
    }
    .menu div { padding: 7px 28px; }
    .menu div:hover { background: #f3f4f6; }
    .menu .inspect {
      outline: 2px solid #e53935;
      outline-offset: -2px;
      background: #fff5f5;
      font-weight: 600;
    }
    .hint-f12 {
      position: absolute;
      left: 32px;
      bottom: 32px;
      background: rgba(15, 23, 42, 0.88);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      max-width: 420px;
    }
    kbd {
      background: #374151;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="menu">
    <div>Back</div>
    <div>Reload</div>
    <div>Save as…</div>
    <div>Print…</div>
    <div class="inspect">Inspect</div>
  </div>
  <div class="hint-f12">Hoặc nhấn <kbd>F12</kbd> trên bàn phím để mở DevTools</div>
</body>
</html>
