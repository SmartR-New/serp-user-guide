<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="_devtools-styles.css" />
</head>
<body>
  <div class="wrap">
    <div class="erp-shot" aria-hidden="true"></div>
    <div class="devtools">
      <div class="dt-header">
        <span class="dt-title">DevTools — dev-erp.smartr.co</span>
        <span class="dt-close">✕</span>
      </div>
      <div class="dt-tabs">
        <span class="dt-tab">Elements</span>
        <span class="dt-tab active">Network</span>
        <span class="dt-tab">Console</span>
        <span class="dt-tab">Sources</span>
      </div>
      <div class="dt-toolbar">
        <label><input type="checkbox" disabled /> Preserve log</label>
        <label class="highlight"><input type="checkbox" checked disabled /> Disable cache</label>
        <span>No throttling</span>
      </div>
      <div class="dt-grid">Khi DevTools đang mở, trình duyệt tạm không dùng cache cho trang này.</div>
    </div>
    <div class="dt-hint">Bước 3 — Tick <strong>Disable cache</strong></div>
  </div>
</body>
</html>
